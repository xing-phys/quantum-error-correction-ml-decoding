name: Build and publish textbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - name: Install SVG conversion and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
          python -m pip install -r requirements-lock.txt
      - name: Merge verified references and build HTML/PDF
        run: |
          python scripts/merge_bibliography.py
          quarto render
          touch _site/.nojekyll
      - name: Verify science and all local publication links
        run: python scripts/verify.py
          node scripts/verify_interactives.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
