project:
  type: book
  output-dir: _site
  resources:
    - examples/
    - data/
    - assets/interactives.js
    - assets/book.js
    - .nojekyll

book:
  title: "Quantum Error Correction and Machine-Learning Decoders"
  subtitle: "From first principles to intelligent fault tolerance"
  output-file: qec-ml-textbook
  author:
    - name: Ze-Yu Xing
      orcid: 0009-0009-5655-0187
      affiliations:
        - Institute of Physics, Chinese Academy of Sciences
        - University of Chinese Academy of Sciences
  date: "2026-10-23"
  date-format: long
  site-url: https://xing-phys.github.io/quantum-error-correction-ml-decoding/
  repo-url: https://github.com/xing-phys/quantum-error-correction-ml-decoding
  repo-actions: [source, issue]
  search:
    type: overlay
  downloads: [pdf]
  reader-mode: true
  sidebar:
    style: docked
    collapse-level: 1
    title: "QEC & ML Decoding"
  chapters:
    - index.qmd
    - part: "The language of error correction"
      chapters:
        - 01-prerequisites.qmd
        - 02-classical-codes.qmd
        - 03-quantum-correction.qmd
        - 04-stabilizer-css.qmd
    - part: "ICodes and fault-tolerant hardware"
      chapters:
        - 05-topological-codes.qmd
        - 06-quantum-ldpc.qmd
        - 07-fault-tolerance.qmd
    - part: "IIDecoding as inference"
      chapters:
        - 08-matching-renormalization.qmd
        - 09-belief-propagation.qmd
        - 10-statistical-mechanics.qmd
    - part: "Learning to decode"
      chapters:
        - 11-machine-learning.qmd
        - 12-neural-graph-decoders.qmd
        - 13-transformers.qmd
        - 14-generative-rl.qmd
        - 15-frontiers.qmd
    - part: "Experiments and reproducible research"
      chapters:
        - 16-benchmarking.qmd
        - 17-computational-labs.qmd
    - references.qmd
  appendices:
    - 18-notation-solutions.qmd
  page-footer:
    left: "Quantum Error Correction and Machine-Learning Decoders"
    right: "Research edition · October 2026"

bibliography: assets/bibliography.bib
csl: assets/american-physics-society.csl
link-citations: true
lang: en
crossref:
  chapters: true
execute:
  enabled: false

format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    fig-responsive: true
    html-math-method: mathjax
    default-image-extension: svg
    include-in-header: assets/mathjax-config.html
    include-after-body: assets/scripts.html
    smooth-scroll: true
    anchor-sections: true
    reference-location: document
    grid:
      body-width: 830px
      sidebar-width: 290px
      margin-width: 220px
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    papersize: a4
    geometry: [margin=24mm]
    fontsize: 10pt
    colorlinks: true
    toc: true
    toc-depth: 2
    number-sections: true
    include-in-header: assets/macros.sty
    keep-tex: false
    reference-location: document
    fig-pos: H
